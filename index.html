<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEA Ecosystem: The Elm Architecture in every language</title>
    <meta
      name="description"
      content="Every framework that implements The Elm Architecture (TEA, Model View Update), from Elm, Elmish and Lustre to Iced, Bubble Tea and react-tea-cup, graded part by part against Elm, in every language."
    />
    <!-- Each page rendered ahead of time (`scripts/prerender.mjs`) gets
         its own title, description, canonical link and link preview in
         place of these -->
    <link rel="canonical" href="https://tea.rinn7e.com/" />
    <!-- The link preview of chat apps and social sites (Reddit, Slack,
         Discord, X): the share card of the page (`src/share-card.tsx`), by
         absolute URL, as their crawlers do not run the app. These are the
         tags of the catalog; each page names its own. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TEA Ecosystem" />
    <meta property="og:url" content="https://tea.rinn7e.com/" />
    <meta property="og:title" content="TEA Ecosystem" />
    <meta
      property="og:description"
      content="Every language and framework that implements The Elm Architecture, graded part by part against Elm."
    />
    <meta
      property="og:image"
      content="https://tea.rinn7e.com/og/page/catalog.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TEA Ecosystem: The Elm Architecture, everywhere"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- A link with a filter in its query opens on the HTML of the plain
         page (`scripts/prerender.mjs` renders no query): hide it, so the
         app draws the filtered page from nothing (`src/root.tsx`). A key
         the app does not read (a tracking tag such as `fbclid`) changes
         nothing, so that page is hydrated. The keys are `queryKeysRead`
         of `src/common/type/destination/parser.ts`, which a test keeps
         the same. -->
    <script>
      {
        const queryKeysRead = [
          'tier',
          'lacks',
          'target',
          'status',
          'query',
          'show',
          'language',
          'includeArchived',
          'layout',
          'sort',
          'order',
        ]
        const query = new URLSearchParams(location.search)
        if (queryKeysRead.some((key) => query.has(key))) {
          document.documentElement.dataset.snapshot = 'stale'
        }
      }
    </script>
    <style>
      html[data-snapshot='stale'] #root {
        visibility: hidden;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The two weights of the first paint (text and the names of the
         entries), asked for with the stylesheet, so they arrive before or
         with it (`src/asset/index.css`) -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <noscript>
      <h1>TEA Ecosystem: The Elm Architecture in every language</h1>
      <p>
        A catalog of every framework that implements The Elm Architecture (TEA,
        Model View Update), graded part by part against Elm. It needs JavaScript
        to run.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/root.tsx"></script>
  </body>
</html>
